name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"
  MPLBACKEND: Agg            # 无显示环境

jobs:
  selfcheck:
    name: 结构与引用自检
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 八项自检（引用 / 死链 / 行内相对路径 / 资产路径 / 孤儿方法论 / 孤儿示例 / 硬编码颜色 / 产出）
        run: python scripts/check_refs.py
      - name: 示例索引与仓库保持一致
        run: |
          python scripts/check_refs.py --write-index
          if ! git diff --quiet -- skills/pretty-charts/examples/INDEX.md; then
            echo "::error file=skills/pretty-charts/examples/INDEX.md::索引已过期，请本地运行 python scripts/check_refs.py --write-index 并提交"
            git diff --stat -- skills/pretty-charts/examples/INDEX.md
            exit 1
          fi

  python-examples:
    name: Python 示例（16 个）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: 安装依赖（从锁文件，保证可复现）
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lock.txt
      - name: 每个示例都必须退出码 0
        run: |
          fail=0
          while IFS= read -r py; do
            echo "::group::$py"
            if ! ( cd "$(dirname "$py")" && python "$(basename "$py")" ); then
              echo "::error file=$py::示例执行失败（退出码非 0）"
              fail=1
            fi
            echo "::endgroup::"
          done < <(find skills/pretty-charts/examples -name '*.py' | sort)
          exit $fail
      - name: 主题循环色必须等于色板 JSON（references/common.md「取色与配色」§1）
        run: |
          cd skills/pretty-charts/examples/style-demo
          python demo_styles.py || {
            echo "::error file=skills/pretty-charts/examples/style-demo/demo_styles.py::主题循环色与 palettes/*.json 不一致"
            exit 1
          }
      - name: 复查八项自检（含产出存在性）
        run: python scripts/check_refs.py

  latex-examples:
    name: LaTeX 示例（16 个）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装 TeX Live（XeLaTeX + 中文 + 图表宏包）
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-xetex texlive-latex-recommended texlive-latex-extra \
            texlive-pictures texlive-fonts-recommended texlive-lang-chinese \
            fonts-noto-cjk fonts-noto-cjk-extra fonts-texgyre
          # fonts-noto-cjk 只带 Noto Sans CJK；衬线回退（Noto Serif CJK SC）在 -extra 包里
          # fonts-texgyre 把 TeX Gyre 注册进 fontconfig —— TeX Live 自带的那份
          # 对 fontspec（走 fontconfig）不可见，这正是 run#1~#3 的真实报错来源:
          #   ! Package fontspec Error: The font "TeX Gyre Termes" cannot be found.
      - name: 每个 .tex 都必须编译通过
        run: |
          fail=0
          while IFS= read -r tex; do
            dir=$(dirname "$tex"); base=$(basename "$tex"); stem="${base%.tex}"
            echo "::group::$tex"
            if ! ( cd "$dir" && xelatex -interaction=nonstopmode -halt-on-error "$base" ); then
              # 把 .log 里的第一条错误带进注解，便于在 PR 界面与 API 直接看到原因
              err=$(grep -m1 -A2 '^!' "$dir/$stem.log" 2>/dev/null | tr '\n' ' ' | cut -c1-500)
              err=${err:-"xelatex 退出码非 0（未在 .log 中匹配到 ^! 行）"}
              echo "::error file=$tex::xelatex 失败：$err"
              fail=1
            fi
            echo "::endgroup::"
          done < <(find skills/pretty-charts/examples -name '*.tex' | sort)
          exit $fail
      - name: 复查八项自检（含 .tex 同名 PDF 存在性）
        run: python scripts/check_refs.py

  # 说明：本仓库的成图（PNG/PDF）是提交进仓库的交付物，但 CI 不做字节比对——
  # matplotlib 的字体光栅化与 xelatex 的 PDF ID/时间戳在不同平台必然不同，
  # 做字节比对只会产生噪声失败。CI 验证的是“代码能跑通、能编译、结构自洽”。
