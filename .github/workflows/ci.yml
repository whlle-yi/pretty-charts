name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"
  MPLBACKEND: Agg            # 无显示环境

jobs:
  selfcheck:
    name: 结构与引用自检
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 五项自检（引用 / 孤儿方法论 / 孤儿示例 / 硬编码颜色 / 产出存在性）
        run: python scripts/check_refs.py
      - name: 示例索引与仓库保持一致
        run: |
          python scripts/check_refs.py --write-index
          if ! git diff --quiet -- skills/pretty-charts/examples/INDEX.md; then
            echo "::error::examples/INDEX.md 已过期，请本地运行 python scripts/check_refs.py --write-index 并提交"
            git diff --stat -- skills/pretty-charts/examples/INDEX.md
            exit 1
          fi

  python-examples:
    name: Python 示例（16 个）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: 每个示例都必须退出码 0
        run: |
          fail=0
          while IFS= read -r py; do
            echo "::group::$py"
            ( cd "$(dirname "$py")" && python "$(basename "$py")" ) || fail=1
            echo "::endgroup::"
          done < <(find skills/pretty-charts/examples -name '*.py' | sort)
          exit $fail
      - name: 主题循环色必须等于色板 JSON（spec/color.md §1）
        run: cd skills/pretty-charts/examples/style-demo && python demo_styles.py
      - name: 复查五项自检（含产出存在性）
        run: python scripts/check_refs.py

  latex-examples:
    name: LaTeX 示例（16 个）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装 TeX Live（XeLaTeX + 中文 + 图表宏包）
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-xetex texlive-latex-extra texlive-pictures \
            texlive-fonts-recommended texlive-lang-chinese \
            fonts-noto-cjk fonts-noto-cjk-extra
          # fonts-noto-cjk 只带 Noto Sans CJK；衬线回退（Noto Serif CJK）在 -extra 包里
      - name: 每个 .tex 都必须编译通过
        run: |
          fail=0
          while IFS= read -r tex; do
            echo "::group::$tex"
            ( cd "$(dirname "$tex")" \
              && xelatex -interaction=nonstopmode -halt-on-error "$(basename "$tex")" ) || fail=1
            echo "::endgroup::"
          done < <(find skills/pretty-charts/examples -name '*.tex' | sort)
          exit $fail
      - name: 复查五项自检（含 .tex 同名 PDF 存在性）
        run: python scripts/check_refs.py
      - name: 说明
        run: |
          echo "注意：本作业只验证「能编译出 PDF」，不比对 PDF 字节。"
          echo "跨平台字体光栅化与 PDF 时间戳会使字节不同，故仓库内提交的成图不参与 CI 比对。"

  # 说明：本仓库的成图（PNG/PDF）是提交进仓库的交付物，但 CI 不做字节比对——
  # matplotlib 的字体光栅化与 xelatex 的 PDF ID/时间戳在不同平台必然不同，
  # 做字节比对只会产生噪声失败。CI 验证的是"代码能跑通、能编译、结构自洽"。
